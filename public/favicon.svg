<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.1" />
    </linearGradient>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#0b0b12" stroke="url(#grad)" stroke-width="2.5" />
  
  <!-- Subtle inner glow fill -->
  <rect x="5" y="5" width="54" height="54" rx="13" fill="url(#glow)" />
  
  <!-- DM Monogram text -->
  <text x="32" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="26" font-weight="800" fill="url(#grad)" text-anchor="middle" letter-spacing="-1">DM</text>
  
  <!-- Code dot accent -->
  <circle cx="48" cy="20" r="3" fill="#6366f1" />
</svg>
